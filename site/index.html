<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logic Library Explorer</title>
<meta name="description" content="Reusable JavaScript logic modules for humans and AI agents: one source, docs and tests.">
<link rel="stylesheet" href="style.css">
</head>
<body data-view="list">
<header class="top">
  <div class="title"><h1>Logic Library Explorer</h1><p>Reusable JavaScript logic modules for humans and AI agents</p></div>
  <nav class="links" aria-label="Machine-readable index">
    <a href="llms.txt">llms.txt</a><a href="modules.json">modules.json</a>
    <a href="https://github.com/yapweijun1996/js-logic-library">GitHub</a>
  </nav>
</header>
<div class="layout">
  <aside class="filters" aria-label="Categories and filters">
    <h2>Categories</h2>
    <ul id="cats" class="cats"></ul>
    <h2>Quick filters</h2>
    <label><input type="checkbox" id="f-verified"> Verified only</label>
    <label><input type="checkbox" id="f-nodeps"> No dependencies</label>
  </aside>
  <section class="registry" aria-label="Modules">
    <input id="q" type="search" placeholder="Search modules or functions   ( / )" aria-label="Search modules or functions" autocomplete="off">
    <p id="count" class="count" role="status"></p>
    <ul id="list" class="list"></ul>
  </section>
  <main id="detail" class="detail" tabindex="-1"><p class="empty">Loading modules…</p></main>
</div>
<script src="app.js" type="module"></script>
</body>
</html>
